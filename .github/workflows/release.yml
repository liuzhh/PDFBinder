name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/pdfbinder.exe, README.md, LICENSE `
            -DestinationPath "dist/pdfbinder-$version-windows-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          $asset = "dist/pdfbinder-$version-windows-x64.zip"
          gh release create $version $asset `
            --title "PDF Binder $version" `
            --notes "Windows x64 build. Unzip and run pdfbinder.exe. The binary is unsigned, so SmartScreen may warn on first launch."